<title>OpenSculptBoy</title>
<script>
  // the theme before the page draws: the choice of the View menu (saved by src/shell/state.ts), else the system's
  (function () {
    var t = 'system';
    try { t = (JSON.parse(localStorage.getItem('anny-ui') || '{}').shell || {}).theme || 'system'; } catch (e) { /* storage unavailable */ }
    var dark = t === 'dark' || (t !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    if (dark) document.documentElement.classList.add('dark');
  })();
</script>

<div id="stage"><canvas id="c" tabindex="0" aria-label="Interactive 3D figure of the character, on the Anny body model. Drag to turn, right-drag to move, scroll to zoom, double-click to focus."></canvas></div>

<div class="loader" aria-live="polite">
  <div class="loadbox">
    <span class="osb-brand">OpenSculptBoy</span>
    <p id="loadlabel">Loading</p>
    <div class="track"><div id="loadbar"></div></div>
  </div>
</div>
